plugins {
    id 'com.android.application'
}

android {
    namespace 'com.theprincelive.whatsthat'
    compileSdk 35

    defaultConfig {
        applicationId 'com.theprincelive.whatsthat'
        minSdk 26
        targetSdk 35
        versionCode 4
        versionName '1.3'
    }

    signingConfigs {
        release {
            def keystorePath = project.findProperty('WHATS_THAT_KEYSTORE')
            def keystorePassword = project.findProperty('WHATS_THAT_STORE_PASSWORD')
            def keyAliasValue = project.findProperty('WHATS_THAT_KEY_ALIAS')
            def keyPasswordValue = project.findProperty('WHATS_THAT_KEY_PASSWORD')

            storeFile file(keystorePath)
            storePassword keystorePassword
            keyAlias keyAliasValue
            keyPassword keyPasswordValue
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }
}
