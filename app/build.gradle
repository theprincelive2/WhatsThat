plugins {
    id 'com.android.application'
}

android {
    namespace 'com.theprincelive.whatsthat'
    compileSdk 35

    defaultConfig {
        applicationId 'com.theprincelive.whatsthat'
        minSdk 26
        targetSdk 35
        versionCode 5
        versionName '1.4'
    }

    def keystorePath = project.findProperty('WHATS_THAT_KEYSTORE')
    def storePasswordValue = project.findProperty('WHATS_THAT_STORE_PASSWORD')
    def keyAliasValue = project.findProperty('WHATS_THAT_KEY_ALIAS')
    def keyPasswordValue = project.findProperty('WHATS_THAT_KEY_PASSWORD')
    def hasReleaseSigning = keystorePath != null && storePasswordValue != null && keyAliasValue != null && keyPasswordValue != null && file(keystorePath).exists()

    signingConfigs {
        release {
            if (hasReleaseSigning) {
                storeFile file(keystorePath)
                storePassword storePasswordValue
                keyAlias keyAliasValue
                keyPassword keyPasswordValue
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            if (hasReleaseSigning) {
                signingConfig signingConfigs.release
            }
        }
    }
}
