name: Build Android APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v3
      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace
      - name: Build signed release APK
        env:
          KEYSTORE_B64: ${{ secrets.WHATS_THAT_KEYSTORE_B64 }}
          STORE_PASSWORD: ${{ secrets.WHATS_THAT_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.WHATS_THAT_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.WHATS_THAT_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "No keystore secret found. Skipping signed release build."
            exit 0
          fi
          echo "$KEYSTORE_B64" | base64 -d > whats_that_keystore.jks
          ./gradlew assembleRelease -PWHATS_THAT_KEYSTORE=../whats_that_keystore.jks -PWHATS_THAT_STORE_PASSWORD="$STORE_PASSWORD" -PWHATS_THAT_KEY_ALIAS="$KEY_ALIAS" -PWHATS_THAT_KEY_PASSWORD="$KEY_PASSWORD" --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: WhatsThat-V6-builds
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk
